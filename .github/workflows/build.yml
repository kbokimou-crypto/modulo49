name: Construire Modulo49 pour Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm modulo49.spec
      - name: Installateur Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installateur.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Modulo49-Setup
          path: installateur/Modulo49-Setup.exe
      - name: Publier la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" installateur/Modulo49-Setup.exe --title "Modulo49 v1.0.${{ github.run_number }}" --notes "Installateur Windows de Modulo49." --latest
